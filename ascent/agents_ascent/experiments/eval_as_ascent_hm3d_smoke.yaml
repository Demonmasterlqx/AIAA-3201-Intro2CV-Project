defaults:
  - /habitat_baselines: habitat_baselines_rl_config_base
  - /habitat: habitat_config_base
  - /habitat/task: as_ascent_objectnav
  - /habitat/task/lab_sensors:
      - base_explorer
      - heading_sensor
      - frontier_sensor
  - /habitat/task/measurements:
    - multi_floor_map
    - traveled_stairs
  - /habitat/simulator/sensor_setups@habitat.simulator.agents.agent_0: rgbd_agent
  - /habitat/simulator/sensor_setups@habitat.simulator.agents.agent_1: rgbd_agent
  - /habitat/dataset/objectnav: hm3d
  - /habitat_baselines/rl/policy: as_ascent_policy
  - _self_

habitat:
  environment:
    max_episode_steps: 500
    iterator_options:
      max_scene_repeat_steps: 50000
      shuffle: False
  gym:
    obs_keys:
      - agent_0_rgb
      - agent_0_depth
      - agent_0_objectgoal
      - agent_0_compass
      - agent_0_gps
      - agent_0_heading
      - agent_1_rgb
      - agent_1_depth
      - agent_1_objectgoal
      - agent_1_compass
      - agent_1_gps
      - agent_1_heading
  simulator:
    type: AscentMultiAgentSim-v0
    turn_angle: 30
    agents_order:
      - agent_0
      - agent_1
    agents:
      agent_0:
        sim_sensors:
          rgb_sensor:
            width: 640
            height: 480
            hfov: 79
            position: [0, 0.88, 0]
          depth_sensor:
            width: 640
            height: 480
            hfov: 79
            min_depth: 0.5
            max_depth: 5.0
            position: [0, 0.88, 0]
        height: 0.88
        radius: 0.18
      agent_1:
        sim_sensors:
          rgb_sensor:
            width: 640
            height: 480
            hfov: 79
            position: [0, 0.88, 0]
          depth_sensor:
            width: 640
            height: 480
            hfov: 79
            min_depth: 0.5
            max_depth: 5.0
            position: [0, 0.88, 0]
        height: 0.88
        radius: 0.18
    habitat_sim_v0:
      gpu_device_id: 0
      allow_sliding: False
  task:
    success_reward: 2.5
    slack_reward: -1e-3
    lab_sensors:
      base_explorer:
        turn_angle: 30
        area_thresh: 1.5
    actions:
      joint_nav_action:
        tilt_angle: 30

habitat_baselines:
  evaluate: True
  eval_ckpt_path_dir: dummy_policy.pth
  num_environments: 1
  load_resume_state_config: False
  verbose: false
  torch_gpu_id: 0
  tensorboard_dir: "debug/tb_agents_ascent_naive_hm3d_smoke"
  video_dir: "debug/video_agents_ascent_naive_hm3d_smoke"
  test_episode_count: 1
  checkpoint_folder: "debug/"
  trainer_name: "ascent"
  num_updates: 1
  log_interval: 10
  num_checkpoints: 1
  force_torch_single_threaded: True
  video_fps: 10
  eval_keys_to_include_in_name: ["success","spl","num_steps"]
  eval:
    split: "val"
    video_option: ["disk"]
  rl:
    agent:
      type: "AscentCentralAccessMgr"
    policy:
      main_agent:
        name: "AscentMultiAgentPolicy"
        nearby_distance: 3.0
        topk: 3
        action_distribution_type: categorical
        obstacle_map_area_threshold: 1.5
        pointnav_policy_path: "third_party/vlfm/data/pointnav_weights.pth"
        as_ascent:
          coordination_mode: "naive_shared"
          real_dual_agent: true
          enable_shared_memory: true
          enable_target_fusion: true
          enable_soft_no_return: true
          logging:
            log_dir_template: "results/agents_ascent_naive/hm3d/{run_id}"
          smoke:
            enabled: true
            default_episode_count: 1
    ppo:
      clip_param: 0.2
      ppo_epoch: 2
      num_mini_batch: 2
      value_loss_coef: 0.5
      entropy_coef: 0.01
      lr: 2.5e-4
      eps: 1e-5
      max_grad_norm: 0.2
      num_steps: 128
      use_gae: True
      gamma: 0.99
      tau: 0.95
      use_linear_clip_decay: False
      use_linear_lr_decay: False
      reward_window_size: 50
      use_normalized_advantage: False
      hidden_size: 512
    ddppo:
      sync_frac: 0.6
      distrib_backend: NCCL
      pretrained_weights: data/ddppo-models/gibson-2plus-resnet50.pth
      pretrained: False
      pretrained_encoder: False
      train_encoder: True
      reset_critic: False
      backbone: resnet18
      rnn_type: LSTM
      num_recurrent_layers: 2
