ENVIRONMENT:
  MAX_EPISODE_STEPS: 500

SIMULATOR:
  FORWARD_STEP_SIZE: 0.25
  TURN_ANGLE: 30
  TILT_ANGLE: 30
  AGENT_0:
    SENSORS: ["RGB_SENSOR", "DEPTH_SENSOR"]
    HEIGHT: 0.88
    RADIUS: 0.18
  HABITAT_SIM_V0:
    ALLOW_SLIDING: False
  RGB_SENSOR:
    WIDTH: 640
    HEIGHT: 480
    HFOV: 79
    POSITION: [0, 0.88, 0]
  DEPTH_SENSOR:
    WIDTH: 640
    HEIGHT: 480
    HFOV: 79
    POSITION: [0, 0.88, 0]
    MIN_DEPTH: 0.0
    MAX_DEPTH: 10.0
    NORMALIZE_DEPTH: False

TASK:
  TYPE: ObjectNav-v1
  DISTANCE_TO_GOAL:
    DISTANCE_TO: VIEW_POINTS
  SUCCESS:
    SUCCESS_DISTANCE: 0.1
  SUCCESS_DISTANCE: 0.1
  SENSORS: ["OBJECTGOAL_PROMPT_SENSOR"]
  MEASUREMENTS:
    [
      "DISTANCE_TO_GOAL",
      "SUCCESS",
      "SPL",
      "SOFT_SPL",
      "TOP_DOWN_MAP",
      "COLLISIONS",
      "AGENT_ROTATION",
      "AGENT_POSITION",
    ]
  TOP_DOWN_MAP:
    MAX_EPISODE_STEPS: 500
    MAP_PADDING: 3
    MAP_RESOLUTION: 1024
    DRAW_SOURCE: True
    DRAW_BORDER: True
    DRAW_SHORTEST_PATH: False
    DRAW_VIEW_POINTS: False
    DRAW_GOAL_POSITIONS: False
    DRAW_GOAL_AABBS: False
    FOG_OF_WAR:
      DRAW: True
      VISIBILITY_DIST: 5.0
      FOV: 79

DATASET:
  TYPE: ObjectNav-v1
  SPLIT: val
  SCENES_DIR: "../data/scene_datasets"
  DATA_PATH: "../data/datasets/objectnav/hm3d/v1/{split}/{split}.json.gz"
